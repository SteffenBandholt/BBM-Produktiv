<html lang="de">
<head>
<meta charset="UTF-8">
<title>Editor</title>
<link rel="stylesheet" href="./ui/styles/popupFormStandard.css">
<style>
  :root {
    --bbm-font-ui: "Noto Sans", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  html, body {
    font-family: var(--bbm-font-ui);
    margin: 0;
    padding: 0;
    background: var(--bbm-popup-canvas);
    color: var(--bbm-popup-text);
  }
  #root {
    padding: 12px 16px;
  }
  .card {
    box-shadow: 0 12px 30px rgba(0,0,0,0.15);
    padding: 0;
    display: flex;
    flex-direction: column;
    max-height: calc(100vh - 24px);
    overflow: hidden;
  }
  .header {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .title {
    font-size: 18px;
    font-weight: 700;
  }
  .subtitle {
    font-size: 13px;
    opacity: 0.75;
  }
  .form {
    display: grid;
    grid-template-columns: 160px 1fr;
    row-gap: var(--bbm-popup-group-gap);
    column-gap: var(--bbm-popup-label-field-gap);
    align-items: center;
  }
  .actions {
    display: flex;
    gap: 8px;
    justify-content: flex-end;
  }
  button {
    padding: 6px 12px;
    border: 1px solid var(--bbm-popup-border-strong);
    background: var(--bbm-popup-surface-subtle);
    cursor: pointer;
  }
  button.primary {
    background: var(--bbm-popup-primary);
    color: #fff;
    border-color: var(--bbm-popup-primary);
  }
  .note {
    font-size: 12px;
    opacity: 0.7;
  }
</style>
</head>
<body>
<div id="root"></div>
<script src="./editor.js"></script>
</body>
</html>
