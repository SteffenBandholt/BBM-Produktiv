<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: file:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'">
<title>BBM</title>
<style>
  :root {
    --bbm-font-ui: "Noto Sans", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    --bbm-quicklane-marker-width: 30px;
    --bbm-quicklane-marker-height: 132px;
    --bbm-quicklane-marker-bg: #f1f1f1;
    --bbm-quicklane-marker-border: #d9d9d9;
    --bbm-quicklane-marker-color: #333333;
    --bbm-quicklane-marker-radius: 10px 0 0 10px;
    --bbm-quicklane-marker-shadow: -4px 0 12px rgba(0, 0, 0, 0.08);
  }

  html, body {
    font-family: var(--bbm-font-ui);
  }

  /*
   * BBM-weiter Quicklane-Marker-Standard.
   * Aktive produktive Quicklanes:
   * - Protokoll: .bbm-tops-screen-quicklane::before
   * - Restarbeiten: .bbm-restarbeiten-quicklane > button:first-child
   */
  body .bbm-tops-screen-quicklane,
  body .bbm-restarbeiten-quicklane {
    overflow: visible !important;
  }

  body .bbm-tops-screen-quicklane::before,
  body .bbm-restarbeiten-quicklane > button:first-child {
    width: var(--bbm-quicklane-marker-width) !important;
    height: var(--bbm-quicklane-marker-height) !important;
    box-sizing: border-box !important;
    border: 1px solid var(--bbm-quicklane-marker-border) !important;
    border-right: 0 !important;
    border-radius: var(--bbm-quicklane-marker-radius) !important;
    background: var(--bbm-quicklane-marker-bg) !important;
    color: var(--bbm-quicklane-marker-color) !important;
    box-shadow: var(--bbm-quicklane-marker-shadow) !important;
    display: flex !important;
    align-items: center !important;
    justify-content: center !important;
    padding: 8px 0 !important;
    font-family: var(--bbm-font-ui) !important;
    font-size: 12px !important;
    font-weight: 700 !important;
    line-height: 1 !important;
    letter-spacing: 0.08em !important;
    writing-mode: vertical-rl !important;
    transform: rotate(180deg) !important;
    opacity: 1 !important;
    visibility: visible !important;
  }

  /*
   * Protokoll: der aktive TopsScreen besitzt keinen eigenen Marker-Button.
   * Deshalb wird sein vorhandenes ::before zum echten Marker gemacht.
   * Im eingeklappten Zustand sitzt er fest am rechten Fensterrand.
   */
  body .bbm-tops-screen-quicklane::before {
    content: "Tools" !important;
    position: fixed !important;
    right: 0 !important;
    left: auto !important;
    top: 110px !important;
    z-index: 12031 !important;
    pointer-events: none !important;
    background-image: none !important;
  }

  body .bbm-tops-screen-quicklane:hover::before,
  body .bbm-tops-screen-quicklane:focus-within::before,
  body .bbm-tops-screen-quicklane[data-open="true"]::before {
    right: 64px !important;
  }

  /* Restarbeiten: vorhandener echter Marker, gleiche Darstellung und Bewegung. */
  body .bbm-restarbeiten-quicklane > button:first-child {
    position: fixed !important;
    top: 110px !important;
  }
</style>
</head>
<body>
<main id="content"></main>
<script type="module" src="./main.js"></script>
</body>
</html>
