name: SiGeKo central project persistence and form
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/main/db/sigeko*.js'
      - 'src/main/domain/sigeko/**'
      - 'src/shared/sigeko/**'
      - 'src/main/modules/sigeko/**'
      - 'src/main/ipc/sigekoIpc.js'
      - 'src/main/preload.js'
      - 'src/main/print/printData.js'
      - 'src/main/print/sharedFirmsPrintAccess.js'
      - 'src/main/ipc/printIpc.js'
      - 'scripts/tests/sharedFirmsPrintAccess.test.cjs'
      - 'scripts/tests/printJobLifecycle.test.cjs'
      - 'scripts/tests/sigekoProjectRoles.test.cjs'
      - 'scripts/tests/sigekoReadiness.test.cjs'
      - 'scripts/tests/sigekoAuthorities.test.cjs'
      - 'scripts/tests/sigekoProjectAuthorities.test.cjs'
      - 'scripts/tests/sigekoAuthorityTransfer.test.cjs'
      - 'scripts/tests/sigekoPreNotification*.test.cjs'
      - 'scripts/tests/sigekoDocumentTransfer.test.cjs'
      - 'scripts/tests/sigekoWorkflowTransfer.test.cjs'
      - 'src/main/ipc/projectTransferIpc.js'
      - 'src/renderer/modules/sigeko/**'
      - 'scripts/tests/sigekoProjectForm*'
      - 'scripts/tests/sigekoGrunddatenForm.test.cjs'
      - 'scripts/tests/sigekoEntryAcceptance.test.cjs'
      - 'scripts/tests/sigekoEditorManifest.test.cjs'
      - 'scripts/runSigekoProjectFormAcceptance.cjs'
      - 'scripts/helpers/inspectSigekoNativePdfEditor.ps1'
      - 'scripts/helpers/sigekoWorkflowFormAcceptance.cjs'
      - 'package.json'
      - 'src/main/db/database.js'
      - 'src/main/db/projectsRepo.js'
      - 'src/main/domain/projects/**'
      - 'scripts/tests/projectBuilder*.cjs'
      - 'src/renderer/modules/projektverwaltung/screens/ProjectBuilder*.js'
      - 'src/main/ipc/projectsIpc.js'
      - 'src/main/ipc/projectTransferIpc.js'
      - 'scripts/tests/plannedConstructionStart.test.cjs'
      - 'src/renderer/modules/projektverwaltung/screens/ProjectForm*.js'
      - 'src/renderer/modules/projektverwaltung/screens/ProjectPlannedStart.uiEditorContract.js'
      - 'src/renderer/ui-editor/m80Registry.js'
      - 'ui-editor-target.json'
      - 'scripts/tests/plannedStartForm*'
      - 'scripts/runPlannedStartFormAcceptance.cjs'
      - '.github/workflows/sigeko-projects.yml'
  workflow_dispatch:
jobs:
  persistence:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    defaults:
      run:
        working-directory: BBM-Produktiv
    steps:
      - uses: actions/checkout@v4
        with:
          path: BBM-Produktiv
      - uses: actions/checkout@v4
        with:
          repository: SteffenBandholt/UI-Editor-kit
          ref: 5e0d551d93e97c32d169ea6d5107186a44ecd47f
          path: UI-Editor-kit
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install existing dependencies and Electron SQLite ABI
        run: npm ci
      - uses: actions/setup-dotnet@v4
        if: runner.os == 'Windows'
        with:
          dotnet-version: '10.0.x'
      - name: Prepare existing native UI editor for actual PDF tab acceptance
        if: runner.os == 'Windows'
        run: npm run prepare:ui-editor
      - name: Actual SQLite migration, CRUD and ZIP roundtrip
        run: >-
          node -e "const s=require('node:child_process').spawnSync(require('electron'),['scripts/tests/plannedConstructionStart.test.cjs'],{env:{...process.env,ELECTRON_RUN_AS_NODE:'1'},stdio:'inherit'});process.exitCode=s.status??1"
      - name: SiGeKo project roles, module profile and archive integrity
        run: >-
          node -e "const s=require('node:child_process').spawnSync(require('electron'),['scripts/tests/sigekoProjectRoles.test.cjs'],{env:{...process.env,ELECTRON_RUN_AS_NODE:'1'},stdio:'inherit'});process.exitCode=s.status??1"
      - name: Central project builder reference
        run: >-
          node -e "const s=require('node:child_process').spawnSync(require('electron'),['scripts/tests/projectBuilder.test.cjs'],{env:{...process.env,ELECTRON_RUN_AS_NODE:'1'},stdio:'inherit'});process.exitCode=s.status??1"
      - name: SiGeKo calculated readiness and read-only IPC
        run: >-
          node -e "const s=require('node:child_process').spawnSync(require('electron'),['scripts/tests/sigekoReadiness.test.cjs'],{env:{...process.env,ELECTRON_RUN_AS_NODE:'1'},stdio:'inherit'});process.exitCode=s.status??1"
      - name: SiGeKo authority stock migration and manual verification
        run: >-
          node -e "const s=require('node:child_process').spawnSync(require('electron'),['scripts/tests/sigekoAuthorities.test.cjs'],{env:{...process.env,ELECTRON_RUN_AS_NODE:'1'},stdio:'inherit'});process.exitCode=s.status??1"
      - name: SiGeKo project authorities and transfer
        shell: bash
        run: |
          node -e "const s=require('node:child_process').spawnSync(require('electron'),['scripts/tests/sigekoProjectAuthorities.test.cjs'],{env:{...process.env,ELECTRON_RUN_AS_NODE:'1'},stdio:'inherit'});process.exitCode=s.status??1"
          node -e "const s=require('node:child_process').spawnSync(require('electron'),['scripts/tests/sigekoAuthorityTransfer.test.cjs'],{env:{...process.env,ELECTRON_RUN_AS_NODE:'1'},stdio:'inherit'});process.exitCode=s.status??1"
      - name: SiGeKo pre-notification drafts and ZIP preservation
        shell: bash
        run: |
          node -e "const s=require('node:child_process').spawnSync(require('electron'),['scripts/tests/sigekoPreNotification.test.cjs'],{env:{...process.env,ELECTRON_RUN_AS_NODE:'1'},stdio:'inherit'});process.exitCode=s.status??1"
          node -e "const s=require('node:child_process').spawnSync(require('electron'),['scripts/tests/sigekoPreNotificationTransfer.test.cjs'],{env:{...process.env,ELECTRON_RUN_AS_NODE:'1'},stdio:'inherit'});process.exitCode=s.status??1"
      - name: Central project builder ZIP integrity
        run: >-
          node -e "const s=require('node:child_process').spawnSync(require('electron'),['scripts/tests/projectBuilderTransfer.test.cjs'],{env:{...process.env,ELECTRON_RUN_AS_NODE:'1'},stdio:'inherit'});process.exitCode=s.status??1"
      - name: Central project builder form and mounted contract
        run: node scripts/tests/projectBuilderForm.test.cjs
      - name: Form payload and mounted component contract
        run: node scripts/tests/plannedStartForm.test.cjs
      - name: SiGeKo form payload and mounted component contract
        run: node scripts/tests/sigekoGrunddatenForm.test.cjs
      - name: Shared module firms print access and context
        run: >-
          node -e "const s=require('node:child_process').spawnSync(require('electron'),['scripts/tests/sharedFirmsPrintAccess.test.cjs'],{env:{...process.env,ELECTRON_RUN_AS_NODE:'1'},stdio:'inherit'});process.exitCode=s.status??1"
      - name: SiGeKo immutable pre-notification snapshot capture
        run: >-
          node -e "const s=require('node:child_process').spawnSync(require('electron'),['scripts/tests/sigekoPreNotificationSnapshot.test.cjs'],{env:{...process.env,ELECTRON_RUN_AS_NODE:'1'},stdio:'inherit'});process.exitCode=s.status??1"
      - name: SiGeKo final document persistence and V8 ZIP integrity
        shell: bash
        run: |
          node -e "const s=require('node:child_process').spawnSync(require('electron'),['scripts/tests/sigekoPreNotificationDocuments.test.cjs'],{env:{...process.env,ELECTRON_RUN_AS_NODE:'1'},stdio:'inherit'});process.exitCode=s.status??1"
          node -e "const s=require('node:child_process').spawnSync(require('electron'),['scripts/tests/sigekoDocumentTransfer.test.cjs'],{env:{...process.env,ELECTRON_RUN_AS_NODE:'1'},stdio:'inherit'});process.exitCode=s.status??1"
      - name: SiGeKo simple VA workflow and V9/V10 ZIP integrity (Outlook transport simulated)
        shell: bash
        run: |
          node -e "const s=require('node:child_process').spawnSync(require('electron'),['scripts/tests/sigekoPreNotificationWorkflows.test.cjs'],{env:{...process.env,ELECTRON_RUN_AS_NODE:'1'},stdio:'inherit'});process.exitCode=s.status??1"
          node -e "const s=require('node:child_process').spawnSync(require('electron'),['scripts/tests/sigekoPreNotificationWorkflowService.test.cjs'],{env:{...process.env,ELECTRON_RUN_AS_NODE:'1'},stdio:'inherit'});process.exitCode=s.status??1"
          node -e "const s=require('node:child_process').spawnSync(require('electron'),['scripts/tests/sigekoWorkflowTransfer.test.cjs'],{env:{...process.env,ELECTRON_RUN_AS_NODE:'1'},stdio:'inherit'});process.exitCode=s.status??1"
          node -e "const s=require('node:child_process').spawnSync(require('electron'),['scripts/tests/sigekoSimpleWorkflow.test.cjs'],{env:{...process.env,ELECTRON_RUN_AS_NODE:'1'},stdio:'inherit'});process.exitCode=s.status??1"
          node scripts/tests/outlookReminderDraft.test.cjs
      - name: Existing print job lifecycle with explicit module access
        run: >-
          node -e "let failed=0;require('./scripts/tests/printJobLifecycle.test.cjs').runPrintJobLifecycleTests(async(n,f)=>{try{await f();console.log('PASS '+n)}catch(e){failed++;console.error(n,e)}}).then(()=>{process.exitCode=failed?1:0}).catch(e=>{console.error(e);process.exitCode=1})"
      - name: SiGeKo pre-notification form and mounted component contract
        run: node scripts/tests/sigekoPreNotificationForm.test.cjs
      - name: Install Linux display support
        if: runner.os == 'Linux'
        run: |
          ubuntu_sources=/etc/apt/sources.list.d/ubuntu.sources
          test -s "$ubuntu_sources"
          sudo apt-get -o Dir::Etc::sourcelist="$ubuntu_sources" -o Dir::Etc::sourceparts="-" update
          sudo apt-get -o Dir::Etc::sourcelist="$ubuntu_sources" -o Dir::Etc::sourceparts="-" install -y xvfb libgtk-3-0 libnss3 libasound2t64
          sudo chown root:root node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 node_modules/electron/dist/chrome-sandbox
      - name: S5.5 Outlook starter preparation with real IPC and PDFs on Linux
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:sigeko:s5.5:prepare
      - name: S5.5 Outlook starter preparation with real IPC and PDFs on Windows
        if: runner.os == 'Windows'
        run: npm run test:sigeko:s5.5:prepare
      - name: Real Electron form with SQLite on Linux
        if: runner.os == 'Linux'
        env:
          BBM_S22_OUTPUT: ${{ runner.temp }}/s22-results
        run: xvfb-run -a node scripts/runPlannedStartFormAcceptance.cjs
      - name: Real Electron form with SQLite on Windows
        if: runner.os == 'Windows'
        env:
          BBM_S22_OUTPUT: ${{ runner.temp }}/s22-results
        run: node scripts/runPlannedStartFormAcceptance.cjs
      - name: Real Electron SiGeKo project form with SQLite on Linux
        if: runner.os == 'Linux'
        env:
          BBM_S24_OUTPUT: ${{ runner.temp }}/s24-results
        run: xvfb-run -a node scripts/runSigekoProjectFormAcceptance.cjs
      - name: Real Electron SiGeKo project form with SQLite on Windows
        if: runner.os == 'Windows'
        env:
          BBM_S24_OUTPUT: ${{ runner.temp }}/s24-results
        run: node scripts/runSigekoProjectFormAcceptance.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sigeko-project-form-${{ matrix.os }}
          path: ${{ runner.temp }}/s24-results
      - name: Reviewable SiGeKo screenshots and report
        if: always()
        env:
          BBM_S24_OUTPUT: ${{ runner.temp }}/s24-results
        run: >-
          node -e "const fs=require('fs'),p=require('path'),d=process.env.BBM_S24_OUTPUT;for(const n of ['sigeko-project-form-result.json','sigeko-workflow-wide.png','sigeko-workflow-narrow.png','sigeko-workflow-low.png','sigeko-native-pdf-editor.json','sigeko-native-pdf-editor.png','sigeko-project-form-wide-profile.png','sigeko-project-form-wide-roles.png','sigeko-project-form-narrow-profile.png','sigeko-project-form-narrow-roles.png','sigeko-readiness-wide.png','sigeko-readiness-narrow.png','sigeko-authorities-wide-overview.png','sigeko-authorities-wide-record.png','sigeko-authorities-wide-assignment.png','sigeko-authorities-narrow-overview.png','sigeko-authorities-narrow-record.png','sigeko-authorities-narrow-assignment.png','sigeko-prenotification-wide-top.png','sigeko-prenotification-wide-bottom.png','sigeko-prenotification-narrow-top.png','sigeko-prenotification-narrow-bottom.png','sigeko-prenotification-low-top.png','sigeko-prenotification-low-bottom.png']){const f=p.join(d,n);if(fs.existsSync(f))console.log(n+'='+fs.readFileSync(f,n.endsWith('.png')?'base64':'utf8'));}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: planned-start-${{ matrix.os }}
          path: ${{ runner.temp }}/s22-results
      - name: Reviewable isolated form screenshot and report
        if: always()
        env:
          BBM_S22_OUTPUT: ${{ runner.temp }}/s22-results
        run: >-
          node -e "const fs=require('fs'),p=require('path'),d=process.env.BBM_S22_OUTPUT;for(const n of ['planned-start-result.json','planned-start-form.png','project-builder-wide.png','project-builder-narrow.png']){const f=p.join(d,n);if(fs.existsSync(f))console.log(n+'='+fs.readFileSync(f,n.endsWith('.png')?'base64':'utf8'));}"
