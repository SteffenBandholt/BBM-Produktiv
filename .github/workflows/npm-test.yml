name: npm test

on:
  pull_request:
    branches:
      - main
      - modularisierung/projektverwaltung
  push:
    branches:
      - main
      - modularisierung/projektverwaltung

jobs:
  test:
    name: Run npm test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Checkout UI Editor kit sibling for branch verification
        run: git clone --depth 1 https://github.com/SteffenBandholt/UI-Editor-kit.git ../UI-Editor-kit

      - name: Provide BBM-azL sibling contract stub for branch verification
        shell: bash
        run: |
          mkdir -p ../BBM-azL/src/ui ../BBM-azL/host
          cat > ../BBM-azL/package.json <<'EOF'
          {
            "name": "bbm-azl",
            "version": "0.1.0",
            "private": true,
            "type": "module"
          }
          EOF
          cat > ../BBM-azL/src/ui/AzlScreen.js <<'EOF'
          export default class AzlScreen {
            constructor() {}
            async mount() { return this; }
          }
          EOF
          cat > ../BBM-azL/host/bbmProduktiv.cjs <<'EOF'
          function ensureAzlSchema() {}
          module.exports = { ensureAzlSchema };
          EOF

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test
