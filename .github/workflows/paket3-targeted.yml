name: Paket 3 targeted

on:
  push:
    branches:
      - core-271-paket3-projektfirmen-core

permissions:
  contents: write

jobs:
  targeted:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: core-271-paket3-projektfirmen-core
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply workspace regression patch
        run: node scripts/paket3WorkspaceTestPatch.cjs
      - name: Commit workspace regression patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/tests/projektverwaltungModule.test.cjs
          if ! git diff --cached --quiet; then
            git commit -m "Core #271 Paket 3: Workspace-Test auf Core-Aktion aktualisieren [paket3-testpatched]"
            git push origin HEAD:core-271-paket3-projektfirmen-core
          fi
      - name: Install dependencies
        run: npm ci
      - name: Run Paket 3 targeted tests
        run: node scripts/testPaket3ProjectFirms.cjs
